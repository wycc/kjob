name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.9'
            client: kubernetes==32.0.1
          - python: '3.12'
            client: kubernetes==28.1.0
          - python: '3.12'
            client: kubernetes==32.0.1
          - python: '3.14'
            client: kubernetes>=28
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest '${{ matrix.client }}'
      - run: python -m pytest -q
